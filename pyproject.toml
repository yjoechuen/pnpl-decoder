[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pnpl-decoder"
version = "0.1.0"
description = "Reproducible single-trial MEG word classification baseline"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.26", "pandas>=2.2", "h5py>=3.10", "huggingface-hub>=0.30", "pnpl==0.2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "kaggle>=2"]

[project.scripts]
pnpl-decoder = "decoder:main"

[tool.setuptools]
py-modules = ["decoder", "final_test", "models", "kaggle_runner", "research", "study"]

[tool.setuptools.data-files]
"share/pnpl-decoder" = ["config.json", "config_conformer.json", "config_wide_cnn.json", "config_wide_cnn_expanded.json", "final_test.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
